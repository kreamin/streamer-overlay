name: Release

# Push a tag like v0.1.0 to build the Windows installer and publish a GitHub
# Release. Installed apps pick it up automatically on next launch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write # needed to create the Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        # GITHUB_TOKEN lets electron-builder create the Release in this repo.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win

      # Use the tagged commit's message as the Release notes → the app shows it
      # as the "What's new" text on the update splash. So whatever you write in
      # the release commit message becomes the changelog users see.
      - name: Set release notes from commit message
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --notes "$(git log -1 --pretty=%B)"
