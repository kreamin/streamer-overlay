<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="board" class="board hidden">
      <div class="head">
        <div id="title" class="title">Waiting for a bet…</div>
        <div id="status" class="status"></div>
      </div>

      <div id="bar" class="bar"></div>
      <div id="totals" class="totals"></div>

      <div id="feedWrap" class="feed-wrap">
        <div class="feed-title">Recent bets</div>
        <div id="feed" class="feed"></div>
      </div>
    </div>

    <!-- Host runtime: delivers bound field values as the "overlaydata" event. -->
    <script src="/overlay-runtime.js"></script>
    <script src="script.js"></script>
  </body>
</html>
