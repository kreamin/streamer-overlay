<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* Transparent so OBS composites only the overlays over your scene. */
        background: transparent;
        overflow: hidden;
      }
      #root {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
